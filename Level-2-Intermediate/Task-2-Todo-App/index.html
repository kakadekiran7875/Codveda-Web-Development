<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro | To-Do List Application with LocalStorage</title>
  <meta name="description" content="Codveda Web Development Internship - Level 2 Task 2: Functional to-do list app with task creation, editing, deletion, priority categorization, and browser LocalStorage persistence.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-badge">Codveda Web Dev • Level 2 Task 2</div>
      <h1 class="app-title">TaskFlow Pro</h1>
      <p class="app-subtitle">Modern Task Management with Browser LocalStorage Persistence</p>
    </header>

    <!-- Productivity Statistics Dashboard -->
    <section class="stats-card">
      <div class="stats-grid">
        <div>
          <div class="stat-number" id="stat-total">0</div>
          <div class="stat-label">Total Tasks</div>
        </div>
        <div>
          <div class="stat-number" id="stat-active" style="color: #f59e0b;">0</div>
          <div class="stat-label">Pending</div>
        </div>
        <div>
          <div class="stat-number" id="stat-completed" style="color: #10b981;">0</div>
          <div class="stat-label">Completed</div>
        </div>
        <div>
          <div class="stat-number" id="stat-percent" style="color: #818cf8;">0%</div>
          <div class="stat-label">Completion</div>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <!-- New Task Form -->
    <section class="form-card">
      <form id="task-form">
        <div class="input-row">
          <input type="text" id="task-title" class="form-control" placeholder="What task needs to be completed?" required>
          
          <select id="task-category" class="form-control">
            <option value="Internship">Codveda Internship</option>
            <option value="Frontend">Frontend Dev</option>
            <option value="Backend">Backend Dev</option>
            <option value="Personal">Personal</option>
          </select>

          <select id="task-priority" class="form-control">
            <option value="low">🟢 Low Priority</option>
            <option value="medium" selected>🟡 Medium Priority</option>
            <option value="high">🔴 High Priority</option>
          </select>

          <input type="date" id="task-due-date" class="form-control" style="display: none;">

          <button type="submit" class="btn-add">+ Add Task</button>
        </div>
      </form>
    </section>

    <!-- Controls Bar -->
    <div class="controls-bar">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <div style="display: flex; gap: 12px; align-items: center;">
        <input type="text" id="search-tasks" class="search-input" placeholder="🔍 Search tasks...">
        <button id="clear-completed-btn" class="filter-btn" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.3);">
          Clear Completed
        </button>
      </div>
    </div>

    <!-- Task List Container -->
    <main>
      <ul class="task-list" id="task-list"></ul>
      
      <!-- Empty State -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon">📝</div>
        <h3 style="color: white; margin-bottom: 6px;">No Tasks Found</h3>
        <p>You have no matching tasks. Add a new task above or adjust your search filter.</p>
      </div>
    </main>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-content">
      <h3 style="font-size: 1.3rem; margin-bottom: 16px; color: white;">Edit Task Details</h3>
      <form id="edit-form">
        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px;">Task Title</label>
          <input type="text" id="edit-title" class="form-control" required>
        </div>
        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px;">Category</label>
          <select id="edit-category" class="form-control">
            <option value="Internship">Codveda Internship</option>
            <option value="Frontend">Frontend Dev</option>
            <option value="Backend">Backend Dev</option>
            <option value="Personal">Personal</option>
          </select>
        </div>
        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px;">Priority</label>
          <select id="edit-priority" class="form-control">
            <option value="low">🟢 Low Priority</option>
            <option value="medium">🟡 Medium Priority</option>
            <option value="high">🔴 High Priority</option>
          </select>
        </div>
        <div style="margin-bottom: 24px;">
          <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px;">Due Date</label>
          <input type="date" id="edit-due-date" class="form-control">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" id="cancel-edit-btn" class="filter-btn">Cancel</button>
          <button type="submit" class="btn-add">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
